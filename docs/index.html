.hl-c{height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px}.hl-c.wkd{background:#F1F2F6;color:#8A90A2}.hl-c.hol{background:var(--accent);color:#fff;font-weight:700}.hl-c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.hl-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EEF0F3}.hl-row .grow{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.hl-row.past{opacity:.55}.hl-row .lv-date{width:44px;height:44px}
.hl-rm{min-height:36px;width:36px;padding:0;color:var(--danger)}
.si-split{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#fff}
.si-brand{background:var(--accent);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.si-ring{position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.06);pointer-events:none}
.si-logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;position:relative}.si-tile{width:44px;height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center}.si-tile img{width:32px;height:32px;object-fit:contain}
.si-hero{max-width:460px;position:relative}.si-hero h1{font-size:48px;line-height:1.1;letter-spacing:-.02em;margin:0 0 16px}.si-hero p{font-size:17px;line-height:1.5;margin:0;opacity:.9}
.si-pts{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:15px}.si-pts li{display:flex;align-items:center;gap:12px}.si-tick{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.si-foot{font-size:13px;opacity:.75;position:relative}
.si-main{display:flex;align-items:center;justify-content:center;padding:48px 24px}.si-box{width:100%;max-width:400px}.si-box h2{font-size:30px;letter-spacing:-.02em;margin:0 0 8px}
.si-in{min-height:52px;font-size:16px;border-radius:12px;padding:0 16px}.si-btn{min-height:52px;font-size:16px;border-radius:12px}
.si-note{padding:12px 14px;border-radius:12px;background:var(--ground);font-size:13px;color:var(--muted)}
.si-back{display:inline-block;font-weight:600;text-decoration:none;margin-bottom:22px}
.si-fs{border:0;margin:0;padding:0}.si-fs legend{font-size:14px;font-weight:600;padding:0;margin-bottom:8px}
.si-digits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.si-d{min-height:60px;min-width:0;padding:0;text-align:center;border-radius:12px;font:600 24px "IBM Plex Mono",ui-monospace,monospace}.si-d:focus{outline:0;border:2px solid var(--accent);box-shadow:0 0 0 4px #E3E7F6}
.si-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}.si-link{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;min-height:44px;padding:0}.si-link:disabled{color:var(--muted);cursor:default}
@media(max-width:820px){.si-split{grid-template-columns:1fr;grid-template-rows:auto 1fr}.si-brand{padding:28px 24px 60px;gap:28px}.si-hero h1{font-size:30px;margin-bottom:8px}.si-hero p{font-size:15px}.si-pts,.si-foot{display:none}.si-main{background:#fff;margin-top:-32px;border-radius:24px 24px 0 0;position:relative;align-items:flex-start;padding:28px 24px}.si-box h2{font-size:24px}}
</style>
</head>
